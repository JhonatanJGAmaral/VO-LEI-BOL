<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vôlei 2D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a1a2e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  height:100vh; overflow:hidden;
  font-family:'Segoe UI',sans-serif; color:#fff;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#ui {
  display:flex; align-items:center; justify-content:space-between;
  width:100%; padding:5px 12px 2px; flex-shrink:0;
}
.score-box { text-align:center; min-width:60px; }
.score-box .name { font-size:11px; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.score-box .pts  { font-size:34px; font-weight:700; line-height:1; }
.score-box .sets { font-size:11px; color:#aaa; }
#center-info { text-align:center; }
#center-info .rally   { font-size:11px; color:#aaa; text-transform:uppercase; }
#center-info .serving { font-size:10px; color:#ffd700; margin-top:1px; }
#pause-btn {
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
  color:#fff; font-size:16px; width:32px; height:32px;
  border-radius:8px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; margin-left:8px;
}
#canvas-wrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
canvas { display:block; border-radius:6px; touch-action:none; }
#hint { font-size:10px; color:#444; text-align:center; padding:2px 0 4px; flex-shrink:0; }
.key { background:#333; border-radius:3px; padding:1px 4px; font-size:9px; color:#bbb; }

/* Overlays */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.88);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:20; gap:10px; padding:20px;
}
.overlay.show { display:flex; }
.overlay h1 { font-size:26px; font-weight:700; }
.overlay h2 { font-size:18px; font-weight:500; color:#ffd700; }
.overlay p  { font-size:12px; color:#aaa; text-align:center; max-width:360px; line-height:1.6; }
.obtn {
  padding:11px 28px; font-size:15px; font-weight:600;
  background:#e63946; color:#fff; border:none; border-radius:8px;
  cursor:pointer; width:100%; max-width:260px;
}
.obtn:hover { background:#c1121f; }
.obtn.sec { background:rgba(255,255,255,0.12); font-size:13px; padding:9px 20px; }
.obtn.sec:hover { background:rgba(255,255,255,0.22); }
</style>
</head>
<body>

<div id="overlay-menu" class="overlay show">
  <h1>🏐 Vôlei 2D</h1>
  <h2>Escolha o modo</h2>
  <p>Melhor de 3 sets · 25 pontos por set (diff. 2)</p>
  <button class="obtn" id="btn-1p">▶ 1 Jogador vs CPU</button>
  <button class="obtn" id="btn-2p">👥 2 Jogadores (teclado)</button>
  <button class="obtn" id="btn-6v6">🏐 6 vs 6 (toque no seu jogador)</button>
</div>

<div id="overlay-pause" class="overlay">
  <h2>⏸ Pausado</h2>
  <button class="obtn" id="btn-resume">▶ Continuar</button>
  <button class="obtn sec" id="btn-menu">↩ Menu</button>
</div>

<div id="overlay-end" class="overlay">
  <h1>🏆</h1>
  <h2 id="end-title">Vencedor!</h2>
  <p id="end-desc"></p>
  <button class="obtn" id="btn-rematch">▶ Revanche</button>
  <button class="obtn sec" id="btn-menu2">↩ Menu</button>
</div>

<div id="ui">
  <div class="score-box">
    <div class="name" id="name-left">Você</div>
    <div class="pts" id="pts-left" style="color:#4cc9f0;">0</div>
    <div class="sets" id="sets-left">Sets: 0</div>
  </div>
  <div id="center-info">
    <div class="rally" id="rally-info">Set 1</div>
    <div class="serving" id="serving-info">🏐 —</div>
  </div>
  <div style="display:flex;align-items:center;">
    <div class="score-box">
      <div class="name" id="name-right">CPU</div>
      <div class="pts" id="pts-right" style="color:#f72585;">0</div>
      <div class="sets" id="sets-right">Sets: 0</div>
    </div>
    <button id="pause-btn">⏸</button>
  </div>
</div>

<div id="canvas-wrap"><canvas id="c"></canvas></div>
<div id="hint"></div>

<script>
// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');
const hintEl = document.getElementById('hint');

const BASE_W = 900, BASE_H = 480;
let W, H, SCALE;

function resize() {
  const maxW = Math.min(window.innerWidth, BASE_W);
  const maxH = window.innerHeight - 80;
  SCALE = Math.min(maxW/BASE_W, maxH/BASE_H);
  W = Math.round(BASE_W*SCALE);
  H = Math.round(BASE_H*SCALE);
  canvas.width  = W; canvas.height = H;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  if (gameRunning) drawGame();
}
window.addEventListener('resize', resize);

// ── Constants ────────────────────────────────────────────────────────────────
const NET_X   = BASE_W/2;
const NET_H   = 130;
const FLOOR_Y = BASE_H - 36;
const GRAVITY = 0.52;
const PW=32, PH=48;
const BALL_R  = 12;
const JUMP_F  = -14;
const PSPEED  = 5.2;
const BALL_CAP= 16;

const C_LEFT  = '#4cc9f0';
const C_RIGHT = '#f72585';

// ── Game state ───────────────────────────────────────────────────────────────
let gameMode = null; // '1p','2p','6v6'
let gameRunning = false, paused = false;
let state = null;
let lastMode = null;

// ── Player factory ───────────────────────────────────────────────────────────
function makePlayer(x, side, isHuman=false, idx=0) {
  return { x, y:FLOOR_Y-PH, vy:0, onGround:true, side, isHuman, idx,
           score:0, sets:0, hits:0, controlledByTouch:false };
}

// Positions for 6v6 (in base coords)
function sixPositions(side) {
  const xs = side==='left'
    ? [80, 160, 240, 80, 160, 240]
    : [BASE_W-80, BASE_W-160, BASE_W-240, BASE_W-80, BASE_W-160, BASE_W-240];
  return xs;
}

function buildPlayers(mode) {
  if (mode==='1p' || mode==='2p') {
    return {
      left:  [makePlayer(NET_X-200,'left',  true,  0)],
      right: [makePlayer(NET_X+200,'right', mode==='2p', 0)]
    };
  }
  // 6v6: player controls index 0 on left side
  const lxs = sixPositions('left');
  const rxs = sixPositions('right');
  return {
    left:  lxs.map((x,i) => makePlayer(x,'left',  i===0, i)),
    right: rxs.map((x,i) => makePlayer(x,'right', false, i))
  };
}

function initState(serving, prevLeft, prevRight) {
  const bx = serving==='left' ? NET_X-160 : NET_X+160;
  const lplayers = prevLeft  || buildPlayers(gameMode).left;
  const rplayers = prevRight || buildPlayers(gameMode).right;
  // Reset positions
  const lxs = gameMode==='6v6' ? sixPositions('left')  : [NET_X-200];
  const rxs = gameMode==='6v6' ? sixPositions('right') : [NET_X+200];
  lplayers.forEach((p,i)=>{ p.x=lxs[i]; p.y=FLOOR_Y-PH; p.vy=0; p.onGround=true; });
  rplayers.forEach((p,i)=>{ p.x=rxs[i]; p.y=FLOOR_Y-PH; p.vy=0; p.onGround=true; });
  return {
    ball:{ x:bx, y:FLOOR_Y-PH-BALL_R-4, vx:0, vy:0, inPlay:false, touched:null },
    left: lplayers, right: rplayers,
    serving, set:1, matchWinner:null,
    countdown:120, flash:null, flashT:0, flashMsg:''
  };
}

function newMatch() {
  state = initState('left', buildPlayers(gameMode).left, buildPlayers(gameMode).right);
}

function nextRound(serving) {
  const l = state.left, r = state.right;
  const ls = { score:l[0].score, sets:l[0].sets };
  const rs = { score:r[0].score, sets:r[0].sets };
  const setN = state.set;
  state = initState(serving, l, r);
  state.left.forEach(p=>{ p.score=ls.score; p.sets=ls.sets; });
  state.right.forEach(p=>{ p.score=rs.score; p.sets=rs.sets; });
  state.set = setN;
}

// ── Keyboard ─────────────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape') togglePause();
  if(e.code==='Space') e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// ── Touch for 6v6: drag your player ─────────────────────────────────────────
let dragTouch = null; // { id, player }

canvas.addEventListener('touchstart', onTouchStart, {passive:false});
canvas.addEventListener('touchmove',  onTouchMove,  {passive:false});
canvas.addEventListener('touchend',   onTouchEnd,   {passive:false});
canvas.addEventListener('touchcancel',onTouchEnd,   {passive:false});

// Touch controls for 1p/2p (virtual buttons drawn on canvas)
// We track which "zone" each touch is in
let touchZones = {}; // touchId -> zone string

function toBase(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x:(clientX-r.left)/SCALE, y:(clientY-r.top)/SCALE };
}

function onTouchStart(e) {
  e.preventDefault();
  if (!gameRunning || paused) return;
  for (const t of e.changedTouches) {
    const b = toBase(t.clientX, t.clientY);
    if (gameMode==='6v6') {
      handle6v6TouchStart(t.identifier, b);
    } else {
      handleBtnTouchStart(t.identifier, b);
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  if (!gameRunning || paused) return;
  for (const t of e.changedTouches) {
    const b = toBase(t.clientX, t.clientY);
    if (gameMode==='6v6') {
      handle6v6TouchMove(t.identifier, b);
    }
    // btn zones don't need move (held via start/end)
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (gameMode==='6v6') {
      handle6v6TouchEnd(t.identifier);
    } else {
      delete touchZones[t.identifier];
    }
  }
}

// ── 6v6 drag ────────────────────────────────────────────────────────────────
let dragInfo = null; // {id, player}

function handle6v6TouchStart(id, b) {
  // Find human player close to touch
  const human = state.left.find(p=>p.isHuman);
  if (!human) return;
  const dx = b.x - human.x, dy = b.y - human.y;
  if (Math.abs(dx)<PW && Math.abs(dy)<PH*1.5) {
    dragInfo = { id, player:human, offsetX:dx };
    human.controlledByTouch = true;
  }
}
function handle6v6TouchMove(id, b) {
  if (!dragInfo || dragInfo.id!==id) return;
  const p = dragInfo.player;
  p.x = clamp(b.x - dragInfo.offsetX, PW/2+2, NET_X-PW/2-6);
  // Jump if dragged upward significantly
  if (b.y < (FLOOR_Y - PH*1.2) && p.onGround) {
    p.vy = JUMP_F; p.onGround = false;
  }
}
function handle6v6TouchEnd(id) {
  if (dragInfo && dragInfo.id===id) {
    if (dragInfo.player) dragInfo.player.controlledByTouch = false;
    dragInfo = null;
  }
}

// ── Virtual button zones for 1p/2p ───────────────────────────────────────────
// Zones: p1L, p1R, p1J, p2L, p2R, p2J
function handleBtnTouchStart(id, b) {
  const zone = getZone(b.x, b.y);
  if (zone) touchZones[id] = zone;
}
function getZone(bx, by) {
  // Button positions (base coords) — defined in drawTouchButtons()
  for (const btn of touchButtons) {
    const dx = bx-btn.cx, dy = by-btn.cy;
    if (Math.sqrt(dx*dx+dy*dy) < btn.r+8) return btn.zone;
  }
  return null;
}
function zoneActive(z) { return Object.values(touchZones).includes(z); }

// Touch buttons layout (computed each draw)
let touchButtons = [];

function computeTouchButtons() {
  touchButtons = [];
  if (gameMode==='6v6') return;
  const isMobile = window.matchMedia('(pointer:coarse)').matches;
  if (!isMobile) return;

  const r  = Math.round(Math.min(W*0.07, H*0.1, 38));
  const gap = r*0.6;
  const bottomY = BASE_H - r - 12;
  const jumpY   = bottomY - r*2 - gap;

  // P1 (left half)
  const p1cx = NET_X*0.5;
  touchButtons.push(
    { zone:'p1L', cx:p1cx-r-gap, cy:bottomY, r },
    { zone:'p1R', cx:p1cx+r+gap, cy:bottomY, r },
    { zone:'p1J', cx:p1cx,        cy:jumpY,   r }
  );

  if (gameMode==='2p') {
    const p2cx = NET_X + NET_X*0.5;
    touchButtons.push(
      { zone:'p2L', cx:p2cx-r-gap, cy:bottomY, r },
      { zone:'p2R', cx:p2cx+r+gap, cy:bottomY, r },
      { zone:'p2J', cx:p2cx,        cy:jumpY,   r }
    );
  }
}

function drawTouchButtons() {
  computeTouchButtons();
  if (!touchButtons.length) return;
  const labels = { p1L:'◀', p1R:'▶', p1J:'↑', p2L:'◀', p2R:'▶', p2J:'↑' };
  for (const btn of touchButtons) {
    const active = zoneActive(btn.zone);
    ctx.beginPath();
    ctx.arc(s(btn.cx), s(btn.cy), s(btn.r), 0, Math.PI*2);
    ctx.fillStyle = active ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = active ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = s(1.5); ctx.stroke();
    ctx.font = `bold ${s(btn.r*0.9)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[btn.zone], s(btn.cx), s(btn.cy));
    ctx.textBaseline = 'alphabetic';
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function s(v){return v*SCALE;}

function ballHit(ball, player) {
  const hw=PW/2+3, hh=PH/2+3;
  const dx=ball.x-player.x, dy=ball.y-player.y;
  if (Math.abs(dx)>=hw+BALL_R || Math.abs(dy)>=hh+BALL_R) return false;
  const ox=hw+BALL_R-Math.abs(dx), oy=hh+BALL_R-Math.abs(dy);
  if (ox<oy) ball.x=player.x+Math.sign(dx)*(hw+BALL_R);
  else        ball.y=player.y+Math.sign(dy)*(hh+BALL_R);
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const bias=player.side==='left'?1:-1;
  ball.vx=(dx/len)*9+bias*1.5;
  ball.vy=(dy/len)*9-3;
  const spd=Math.sqrt(ball.vx**2+ball.vy**2);
  if(spd>BALL_CAP){ball.vx*=BALL_CAP/spd;ball.vy*=BALL_CAP/spd;}
  ball.inPlay=true; ball.touched=player.side; player.hits++;
  return true;
}

// ── AI ───────────────────────────────────────────────────────────────────────
function aiPlayer(p, ball, allSameSide) {
  if (p.controlledByTouch) return;

  const isMySide = (p.side==='left' && ball.x<NET_X) || (p.side==='right' && ball.x>NET_X);
  const isClosest = allSameSide.reduce((best,q)=>{
    return Math.abs(q.x-ball.x)+Math.abs(q.y-ball.y) < Math.abs(best.x-ball.x)+Math.abs(best.y-ball.y) ? q : best;
  }, allSameSide[0]) === p;

  // Serving AI
  if (!ball.inPlay && state.serving===p.side && p.idx===0) {
    if (state.countdown<=0) {
      const dir = p.side==='left'?1:-1;
      ball.vx=dir*(3+Math.random()*2); ball.vy=-(8+Math.random()*4); ball.inPlay=true;
    }
    return;
  }

  if (!ball.inPlay) {
    // drift back to home
    const homeX = (p.side==='left' ? sixPositions('left') : sixPositions('right'))[p.idx] || (p.side==='left'?NET_X-200:NET_X+200);
    if (Math.abs(p.x-homeX)>8) p.x+=Math.sign(homeX-p.x)*PSPEED*0.4;
    return;
  }

  // Only closest player on active side chases the ball aggressively
  if (isClosest && isMySide) {
    const pred = ball.x+ball.vx*6;
    const diff = pred-p.x;
    if (Math.abs(diff)>10) p.x+=Math.sign(diff)*PSPEED*0.88;
    if (p.onGround && ball.vy>-3 && Math.abs(ball.y-p.y)<180) {
      p.vy=JUMP_F; p.onGround=false;
    }
  } else {
    // Others drift to strategic positions
    const homeXs = p.side==='left' ? sixPositions('left') : sixPositions('right');
    const homeX = homeXs[p.idx]||p.x;
    if (Math.abs(p.x-homeX)>10) p.x+=Math.sign(homeX-p.x)*PSPEED*0.35;
  }

  // Clamp to own side
  if (p.side==='left')  p.x=clamp(p.x,PW/2+2,NET_X-PW/2-6);
  else                  p.x=clamp(p.x,NET_X+PW/2+6,BASE_W-PW/2-4);
}

function applyGravity(p) {
  p.vy+=GRAVITY; p.y+=p.vy;
  if(p.y>=FLOOR_Y-PH){p.y=FLOOR_Y-PH;p.vy=0;p.onGround=true;}
}

// ── Score ────────────────────────────────────────────────────────────────────
function awardPoint(winner) {
  const lp=state.left[0], rp=state.right[0];
  if(winner==='left') lp.score++; else rp.score++;
  const ws=winner==='left'?lp.score:rp.score;
  const ls=winner==='left'?rp.score:lp.score;
  let msg='+1';
  if(ws>=25&&ws-ls>=2){
    if(winner==='left') lp.sets++; else rp.sets++;
    msg='Set! 🏆';
    if(lp.sets>=2||rp.sets>=2){
      state.matchWinner=winner; gameRunning=false;
      setTimeout(showEnd,800); updateUI(); return;
    }
    lp.score=0; rp.score=0; state.set++;
  }
  const sl={score:lp.score,sets:lp.sets}, sr={score:rp.score,sets:rp.sets}, sn=state.set;
  nextRound(winner);
  state.left[0].score=sl.score; state.left[0].sets=sl.sets;
  state.right[0].score=sr.score; state.right[0].sets=sr.sets;
  state.set=sn; state.flash=winner; state.flashT=90; state.flashMsg=msg;
  updateUI();
}

function updateUI() {
  if(!state)return;
  const lp=state.left[0], rp=state.right[0];
  document.getElementById('pts-left').textContent=lp.score;
  document.getElementById('pts-right').textContent=rp.score;
  document.getElementById('sets-left').textContent='Sets: '+lp.sets;
  document.getElementById('sets-right').textContent='Sets: '+rp.sets;
  document.getElementById('rally-info').textContent='Set '+(state.set||1);
  const who=state.serving==='left'
    ?(gameMode==='1p'?'Você':gameMode==='6v6'?'Time A':'J1')
    :(gameMode==='1p'?'CPU' :gameMode==='6v6'?'Time B':'J2');
  document.getElementById('serving-info').textContent='🏐 Saque: '+who;
}

// ── Pause / End ───────────────────────────────────────────────────────────────
function togglePause(){
  if(!gameRunning&&!paused)return;
  paused=!paused;
  document.getElementById('pause-btn').textContent=paused?'▶':'⏸';
  document.getElementById('overlay-pause').classList.toggle('show',paused);
  if(!paused){lastTime=performance.now();requestAnimationFrame(gameLoop);}
}
function showEnd(){
  const w=state.matchWinner;
  const name=gameMode==='6v6'?(w==='left'?'Time Azul venceu! 🎉':'Time Rosa venceu! 🎉')
    :gameMode==='1p'?(w==='left'?'Você venceu! 🎉':'CPU venceu!')
    :(w==='left'?'J1 venceu! 🎉':'J2 venceu! 🎉');
  document.getElementById('end-title').textContent=name;
  document.getElementById('end-desc').textContent=
    'Sets: '+state.left[0].sets+' × '+state.right[0].sets;
  document.getElementById('overlay-end').classList.add('show');
}
function goMenu(){
  paused=false; gameRunning=false;
  document.getElementById('pause-btn').textContent='⏸';
  ['overlay-pause','overlay-end'].forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById('overlay-menu').classList.add('show');
}

document.getElementById('pause-btn').addEventListener('click',togglePause);
document.getElementById('btn-resume').addEventListener('click',togglePause);
document.getElementById('btn-menu').addEventListener('click',goMenu);
document.getElementById('btn-menu2').addEventListener('click',goMenu);
document.getElementById('btn-rematch').addEventListener('click',()=>{
  document.getElementById('overlay-end').classList.remove('show');
  startGame(lastMode);
});

// ── Game loop ─────────────────────────────────────────────────────────────────
let lastTime=0;
function gameLoop(ts){
  if(!gameRunning||paused)return;
  lastTime=ts; update(); drawGame(); updateUI();
  requestAnimationFrame(gameLoop);
}

function update(){
  if(!state||state.matchWinner)return;
  const ball=state.ball;
  const lps=state.left, rps=state.right;

  // ── P1 (left[0]) input ──
  const lhuman = lps[0];
  if(gameMode==='1p'||gameMode==='2p'){
    const p1L=keys['KeyA']||zoneActive('p1L');
    const p1R=keys['KeyD']||zoneActive('p1R');
    const p1J=keys['KeyW']||keys['Space']||zoneActive('p1J');
    if(p1L) lhuman.x-=PSPEED;
    if(p1R) lhuman.x+=PSPEED;
    lhuman.x=clamp(lhuman.x,PW/2+2,NET_X-PW/2-6);
    if(p1J&&lhuman.onGround){lhuman.vy=JUMP_F;lhuman.onGround=false;}
  }
  if(gameMode==='6v6'&&lhuman.controlledByTouch){
    // position set by drag; just handle jump from drag up (done in move)
  }

  // ── P2 (right[0]) input ──
  const rhuman = rps[0];
  if(gameMode==='2p'){
    const p2L=keys['KeyJ']||zoneActive('p2L');
    const p2R=keys['KeyL']||zoneActive('p2R');
    const p2J=keys['KeyI']||zoneActive('p2J');
    if(p2L) rhuman.x-=PSPEED;
    if(p2R) rhuman.x+=PSPEED;
    rhuman.x=clamp(rhuman.x,NET_X+PW/2+6,BASE_W-PW/2-4);
    if(p2J&&rhuman.onGround){rhuman.vy=JUMP_F;rhuman.onGround=false;}
  }

  // ── AI for all non-human players ──
  lps.forEach(p=>{if(!p.isHuman||gameMode==='6v6') aiPlayer(p,ball,lps);});
  rps.forEach(p=>aiPlayer(p,ball,rps));

  // ── Gravity all ──
  [...lps,...rps].forEach(applyGravity);

  // ── Serve ──
  if(!ball.inPlay){
    const server = state.serving==='left' ? lps[0] : rps[0];
    ball.x=server.x; ball.y=server.y-BALL_R-2;
    state.countdown--;
    if(state.serving==='left'&&gameMode!=='6v6'){
      const p1J=keys['KeyW']||keys['Space']||zoneActive('p1J');
      if(p1J){ball.vx=3.5+Math.random()*2;ball.vy=-(9+Math.random()*3);ball.inPlay=true;lps[0].vy=JUMP_F*0.7;}
    }
    if(state.serving==='right'&&gameMode==='2p'){
      const p2J=keys['KeyI']||zoneActive('p2J');
      if(p2J){ball.vx=-(3.5+Math.random()*2);ball.vy=-(9+Math.random()*3);ball.inPlay=true;rps[0].vy=JUMP_F*0.7;}
    }
    return;
  }

  // ── Ball physics ──
  ball.vy+=GRAVITY*0.6; ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.x<BALL_R){ball.x=BALL_R;ball.vx=Math.abs(ball.vx)*0.8;}
  if(ball.x>BASE_W-BALL_R){ball.x=BASE_W-BALL_R;ball.vx=-Math.abs(ball.vx)*0.8;}
  if(ball.y<BALL_R){ball.y=BALL_R;ball.vy=Math.abs(ball.vy)*0.8;}

  // Net
  if(ball.x>NET_X-8&&ball.x<NET_X+8&&ball.y>FLOOR_Y-NET_H){
    ball.vx=-ball.vx*0.65; ball.x+=ball.vx>0?9:-9;
  }

  // Floor → point
  if(ball.y+BALL_R>=FLOOR_Y){
    awardPoint(ball.x<NET_X?'right':'left'); return;
  }

  // Collisions
  [...lps,...rps].forEach(p=>ballHit(ball,p));

  if(state.flashT>0)state.flashT--;
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawGame(){
  ctx.clearRect(0,0,W,H);

  // Sky
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0f3460');bg.addColorStop(1,'#16213e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawCrowd();

  // Floor
  ctx.fillStyle='#c8a96e';ctx.fillRect(0,s(FLOOR_Y),W,H-s(FLOOR_Y));
  ctx.fillStyle='#e0c080';ctx.fillRect(0,s(FLOOR_Y),W,s(3));

  // Net
  ctx.fillStyle='#999';
  ctx.fillRect(s(NET_X-6),s(FLOOR_Y-NET_H-14),s(4),s(NET_H+14));
  ctx.fillRect(s(NET_X+2),s(FLOOR_Y-NET_H-14),s(4),s(NET_H+14));
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=s(2.5);
  ctx.beginPath();ctx.moveTo(s(NET_X-4),s(FLOOR_Y-NET_H));ctx.lineTo(s(NET_X+4),s(FLOOR_Y-NET_H));ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=s(0.8);
  for(let y=0;y<=NET_H;y+=15){
    ctx.beginPath();ctx.moveTo(s(NET_X-4),s(FLOOR_Y-NET_H+y));ctx.lineTo(s(NET_X+4),s(FLOOR_Y-NET_H+y));ctx.stroke();
  }
  // Antennas
  [[NET_X-5],[NET_X+3]].forEach(([ax])=>{
    ctx.fillStyle='#f00';ctx.fillRect(s(ax),s(FLOOR_Y-NET_H-20),s(2),s(20));
    ctx.fillStyle='#fff';ctx.fillRect(s(ax),s(FLOOR_Y-NET_H-30),s(2),s(10));
  });

  // Players
  [...state.left,...state.right].forEach(p=>{
    const label = gameMode==='6v6'
      ? (p.isHuman?'VOCÊ':''+(p.idx+1))
      : (p.side==='left'?(gameMode==='1p'?'J1':'J1'):(gameMode==='1p'?'CPU':'J2'));
    drawPlayer(p, p.side==='left'?C_LEFT:C_RIGHT, label, p.isHuman);
  });

  drawBall(state.ball);

  // Ball shadow
  const sh=Math.max(0,1-(FLOOR_Y-state.ball.y-BALL_R)/300)*0.35;
  ctx.beginPath();ctx.ellipse(s(state.ball.x),s(FLOOR_Y+2),s(BALL_R*0.8),s(3),0,0,Math.PI*2);
  ctx.fillStyle=`rgba(0,0,0,${sh})`;ctx.fill();

  // Touch buttons (1p/2p mobile)
  drawTouchButtons();

  // 6v6 drag hint
  if(gameMode==='6v6'&&window.matchMedia('(pointer:coarse)').matches){
    const human=state.left[0];
    if(!dragInfo){
      ctx.beginPath();
      ctx.arc(s(human.x),s(human.y+PH/2),s(PW*0.8),0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=s(1.5);ctx.stroke();
      ctx.font=`${s(9)}px sans-serif`;ctx.textAlign='center';
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText('arraste',s(human.x),s(human.y+PH+s(12)));
    }
  }

  // Score flash
  if(state.flash&&state.flashT>0){
    const a=Math.min(1,state.flashT/25);
    const tx=state.flash==='left'?s(NET_X/2):s(NET_X+NET_X/2);
    ctx.font=`bold ${s(22)}px 'Segoe UI',sans-serif`;
    ctx.textAlign='center';ctx.fillStyle=`rgba(255,215,0,${a})`;
    ctx.fillText(state.flashMsg||'+1',tx,s(FLOOR_Y-200));
  }
}

function drawCrowd(){
  for(let i=0;i<55;i++){
    const x=i/55*BASE_W,h=18+Math.sin(i*2.3)*7+Math.cos(i*1.1)*4;
    ctx.fillStyle=`hsl(${205+(i%5)*12},28%,${14+(i%3)*5}%)`;
    ctx.beginPath();ctx.arc(s(x+7),s(55-h+5),s(7),0,Math.PI*2);ctx.fill();
    ctx.fillRect(s(x+2),s(55-h+5),s(10),s(18));
  }
}

function drawPlayer(p, color, label, highlight){
  const x=s(p.x),y=s(p.y),pw=s(PW),ph=s(PH);
  // Highlight ring for human player in 6v6
  if(highlight&&gameMode==='6v6'){
    ctx.beginPath();ctx.arc(x,y+ph*0.5,pw*0.75,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=s(1.5);ctx.stroke();
  }
  ctx.beginPath();ctx.ellipse(x,s(FLOOR_Y+2),pw*.42,s(4),0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
  // Jersey
  ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(x-pw*.36,y+ph*.28,pw*.72,ph*.48,s(4));ctx.fill();
  // Shorts
  ctx.fillStyle=darken(color,40);
  ctx.fillRect(x-pw*.31,y+ph*.7,pw*.62,ph*.16);
  // Legs
  ctx.fillStyle='#f5cba7';
  ctx.fillRect(x-pw*.26,y+ph*.84,pw*.2,ph*.13);
  ctx.fillRect(x+pw*.06,y+ph*.84,pw*.2,ph*.13);
  // Shoes
  ctx.fillStyle='#333';
  ctx.fillRect(x-pw*.3,y+ph*.92,pw*.26,s(5));
  ctx.fillRect(x+pw*.04,y+ph*.92,pw*.26,s(5));
  // Head
  ctx.fillStyle='#f5cba7';
  ctx.beginPath();ctx.arc(x,y+ph*.17,pw*.24,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle=color===C_LEFT?'#3a2918':'#111';
  ctx.beginPath();ctx.arc(x,y+ph*.11,pw*.22,Math.PI,0);ctx.fill();
  // Arms
  const up=state.ball&&Math.abs(state.ball.x-p.x)<90&&state.ball.y<p.y;
  ctx.strokeStyle='#f5cba7';ctx.lineWidth=s(4.5);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-pw*.28,y+ph*.4);ctx.lineTo(x-pw*(up?.52:.42),up?y+ph*.2:y+ph*.58);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+pw*.28,y+ph*.4);ctx.lineTo(x+pw*(up?.52:.42),up?y+ph*.2:y+ph*.58);ctx.stroke();
  // Label
  ctx.font=`bold ${s(9)}px 'Segoe UI',sans-serif`;
  ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(label,x,y-s(4));
}

function darken(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;
}

function drawBall(ball){
  const x=s(ball.x),y=s(ball.y),r=s(BALL_R);
  if(ball.inPlay){
    for(let i=1;i<=4;i++){
      ctx.beginPath();
      ctx.arc(x-ball.vx*SCALE*i*.4,y-ball.vy*SCALE*i*.4,r*(1-i*.18),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,215,0,${0.12-i*.022})`;ctx.fill();
    }
  }
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle='#fff8dc';ctx.fill();
  ctx.strokeStyle='#d4b030';ctx.lineWidth=s(1.5);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=s(1);
  ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*.65,0,Math.PI*2);ctx.stroke();
}

// ── Start ─────────────────────────────────────────────────────────────────────
function startGame(mode){
  gameMode=mode; lastMode=mode; paused=false; dragInfo=null; touchZones={};
  document.getElementById('pause-btn').textContent='⏸';
  ['overlay-menu','overlay-pause','overlay-end'].forEach(id=>document.getElementById(id).classList.remove('show'));

  const names={
    '1p': ['Você','CPU'],
    '2p': ['Jogador 1','Jogador 2'],
    '6v6': ['Time Azul','Time Rosa']
  }[mode];
  document.getElementById('name-left').textContent=names[0];
  document.getElementById('name-right').textContent=names[1];

  if(mode==='1p')
    hintEl.innerHTML='<span class="key">A</span><span class="key">D</span> mover &nbsp;<span class="key">W</span> pular/sacar &nbsp;<span class="key">P</span> pausar';
  else if(mode==='2p')
    hintEl.innerHTML='J1:<span class="key">A</span><span class="key">D</span><span class="key">W</span> &nbsp;|&nbsp; J2:<span class="key">J</span><span class="key">L</span><span class="key">I</span> &nbsp;|&nbsp; <span class="key">P</span> pausar';
  else
    hintEl.innerHTML='Arraste o jogador <b>VOCÊ</b> para mover &nbsp;|&nbsp; <span class="key">P</span> pausar';

  newMatch(); resize(); updateUI();
  gameRunning=true; lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

document.getElementById('btn-1p').addEventListener('click',()=>startGame('1p'));
document.getElementById('btn-2p').addEventListener('click',()=>startGame('2p'));
document.getElementById('btn-6v6').addEventListener('click',()=>startGame('6v6'));

resize();
</script>
