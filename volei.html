<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vôlei 2D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a1a2e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
  color:#fff;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#ui {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  max-width:900px;
  padding:6px 16px 2px;
  flex-shrink:0;
}
.score-box { text-align:center; min-width:70px; }
.score-box .name { font-size:12px; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
.score-box .pts { font-size:38px; font-weight:700; line-height:1; }
.score-box .sets { font-size:12px; color:#aaa; }
#center-info { text-align:center; }
#center-info .rally { font-size:12px; color:#aaa; letter-spacing:1px; text-transform:uppercase; }
#center-info .serving { font-size:11px; color:#ffd700; margin-top:1px; }
#pause-btn {
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;
  font-size:18px;
  width:36px; height:36px;
  border-radius:8px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  margin-left:8px;
}
#canvas-wrap {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
  width:100%;
}
canvas { display:block; border-radius:8px; touch-action:none; }

/* Touch overlay buttons */
#touch-controls {
  display:none;
  position:absolute;
  bottom:0; left:0; right:0;
  pointer-events:none;
}
#touch-controls.active { display:block; }
.touch-zone {
  position:absolute;
  pointer-events:all;
  -webkit-tap-highlight-color:transparent;
}
.touch-btn {
  position:absolute;
  background:rgba(255,255,255,0.15);
  border:1.5px solid rgba(255,255,255,0.3);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
  color:rgba(255,255,255,0.7);
  pointer-events:all;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  touch-action:none;
}
.touch-btn.pressed {
  background:rgba(255,255,255,0.35);
  border-color:rgba(255,255,255,0.7);
}

/* Overlay screens */
#overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.88);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:20; gap:12px;
  padding:20px;
}
#overlay h1 { font-size:28px; font-weight:700; }
#overlay h2 { font-size:20px; font-weight:500; color:#ffd700; }
#overlay p { font-size:13px; color:#aaa; text-align:center; max-width:380px; line-height:1.6; }
.ovl-btn {
  padding:12px 32px;
  font-size:16px; font-weight:600;
  background:#e63946; color:#fff;
  border:none; border-radius:8px;
  cursor:pointer; width:100%; max-width:280px;
  transition:background 0.15s;
}
.ovl-btn:hover { background:#c1121f; }
.ovl-btn.secondary {
  background:rgba(255,255,255,0.12);
  font-size:14px; padding:10px 24px;
}
.ovl-btn.secondary:hover { background:rgba(255,255,255,0.22); }

#controls-hint {
  font-size:11px; color:#555;
  text-align:center; padding:3px 0 5px;
  flex-shrink:0;
}
.key { background:#333; border-radius:4px; padding:1px 5px; font-size:10px; color:#ccc; }
</style>
</head>
<body>

<!-- Main overlay (menu / end screen) -->
<div id="overlay">
  <h1>🏐 Vôlei 2D</h1>
  <h2 id="overlay-subtitle">Escolha o modo</h2>
  <p id="overlay-desc">Jogue até 25 pontos (diferença de 2). Quem ganhar 2 sets vence!</p>
  <button class="ovl-btn" id="btn-1p">▶ 1 Jogador (vs CPU)</button>
  <button class="ovl-btn" id="btn-2p">👥 2 Jogadores (mesmo teclado)</button>
  <p style="margin-top:4px;font-size:11px;color:#444;">
    PC: teclas · Celular: botões na tela
  </p>
</div>

<!-- Pause overlay -->
<div id="pause-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:15;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
  <h2 style="font-size:28px;">⏸ Pausado</h2>
  <button class="ovl-btn" id="btn-resume">▶ Continuar</button>
  <button class="ovl-btn secondary" id="btn-menu">↩ Menu principal</button>
</div>

<!-- HUD -->
<div id="ui">
  <div class="score-box">
    <div class="name" id="name-left">Você</div>
    <div class="pts" id="pts-left" style="color:#4cc9f0;">0</div>
    <div class="sets" id="sets-left">Sets: 0</div>
  </div>
  <div id="center-info">
    <div class="rally" id="rally-info">Set 1</div>
    <div class="serving" id="serving-info">🏐 Saque: —</div>
  </div>
  <div style="display:flex;align-items:center;">
    <div class="score-box">
      <div class="name" id="name-right">CPU</div>
      <div class="pts" id="pts-right" style="color:#f72585;">0</div>
      <div class="sets" id="sets-right">Sets: 0</div>
    </div>
    <button id="pause-btn" title="Pausar (P)">⏸</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <!-- Touch controls injected by JS -->
  <div id="touch-controls"></div>
</div>

<div id="controls-hint" id="hint"></div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvas-wrap');
const overlay = document.getElementById('overlay');
const pauseOverlay = document.getElementById('pause-overlay');
const touchControls = document.getElementById('touch-controls');
const hint = document.getElementById('controls-hint');

let W, H, SCALE;
const BASE_W = 900, BASE_H = 480;

function resize() {
  const maxW = Math.min(window.innerWidth, BASE_W);
  // Reserve space for HUD (~80px) and hint (~24px)
  const maxH = window.innerHeight - 104;
  SCALE = Math.min(maxW / BASE_W, maxH / BASE_H);
  W = Math.round(BASE_W * SCALE);
  H = Math.round(BASE_H * SCALE);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (gameRunning) { buildTouchControls(); drawGame(); }
}
window.addEventListener('resize', resize);

// ─── Game constants ───────────────────────────────────────────────────────────
const NET_X   = BASE_W / 2;
const NET_H   = 130;
const FLOOR_Y = BASE_H - 36;
const GRAVITY = 0.55;
const PW = 36, PH = 54;   // player width/height
const BALL_R  = 13;
const JUMP_F  = -14;
const PSPEED  = 5.5;
const BALL_CAP = 17;

const C_LEFT  = '#4cc9f0';
const C_RIGHT = '#f72585';

// ─── State ───────────────────────────────────────────────────────────────────
let gameMode = null;
let gameRunning = false;
let paused = false;
let state = null;

function freshPlayer(side) {
  return {
    x: side === 'left' ? NET_X - 200 : NET_X + 200,
    y: FLOOR_Y - PH,
    vy: 0,
    onGround: true,
    score: 0,
    sets: 0,
    hits: 0
  };
}

function initRound(serving, left, right) {
  const bx = serving === 'left' ? NET_X - 180 : NET_X + 180;
  return {
    ball: { x: bx, y: FLOOR_Y - PH - BALL_R - 4, vx:0, vy:0, inPlay:false, touched:null },
    left:  { ...left,  x: NET_X - 200, y: FLOOR_Y - PH, vy:0, onGround:true },
    right: { ...right, x: NET_X + 200, y: FLOOR_Y - PH, vy:0, onGround:true },
    serving,
    set: (state ? state.set : 1),
    matchWinner: null,
    countdown: 110,
    flash: null, flashT: 0
  };
}

function newMatch() {
  const l = freshPlayer('left');
  const r = freshPlayer('right');
  state = initRound('left', l, r);
}

// ─── Keyboard ────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Touch controls ───────────────────────────────────────────────────────────
// We use virtual buttons positioned absolutely over the canvas.
// Each button tracks its own touchIdentifier so multi-touch works correctly.

let touchState = {
  p1Left:false, p1Right:false, p1Jump:false,
  p2Left:false, p2Right:false, p2Jump:false
};

function buildTouchControls() {
  touchControls.innerHTML = '';
  touchState = { p1Left:false, p1Right:false, p1Jump:false, p2Left:false, p2Right:false, p2Jump:false };

  const isMobile = window.matchMedia('(pointer: coarse)').matches;
  if (!isMobile) { touchControls.classList.remove('active'); return; }
  touchControls.classList.add('active');

  // Button size relative to canvas height
  const btnSize = Math.round(Math.min(W * 0.12, H * 0.18, 64));
  const gap = Math.round(btnSize * 0.3);
  const bottomMargin = Math.round(H * 0.04);
  const halfW = Math.round(W / 2);

  // P1 buttons: left side of canvas
  const p1CenterX = Math.round(halfW * 0.5);
  const btnY = H - bottomMargin - btnSize;
  const p1LeftX  = p1CenterX - btnSize - gap;
  const p1RightX = p1CenterX + gap;
  const p1JumpX  = p1CenterX - Math.round(btnSize/2);
  const jumpY    = btnY - btnSize - gap;

  const defs = [
    { key:'p1Left',  x:p1LeftX,           y:btnY,  label:'◀', half:'left'  },
    { key:'p1Right', x:p1RightX,          y:btnY,  label:'▶', half:'left'  },
    { key:'p1Jump',  x:p1JumpX,           y:jumpY, label:'↑', half:'left'  },
  ];

  if (gameMode === '2p') {
    const p2CenterX = halfW + Math.round(halfW * 0.5);
    const p2LeftX  = p2CenterX - btnSize - gap;
    const p2RightX = p2CenterX + gap;
    const p2JumpX  = p2CenterX - Math.round(btnSize/2);
    defs.push(
      { key:'p2Left',  x:p2LeftX,  y:btnY,  label:'◀', half:'right' },
      { key:'p2Right', x:p2RightX, y:btnY,  label:'▶', half:'right' },
      { key:'p2Jump',  x:p2JumpX,  y:jumpY, label:'↑', half:'right' }
    );
  }

  defs.forEach(def => {
    const el = document.createElement('div');
    el.className = 'touch-btn';
    el.style.cssText = `left:${def.x}px;top:${def.y}px;width:${btnSize}px;height:${btnSize}px;`;
    el.textContent = def.label;
    el.dataset.key = def.key;
    touchControls.appendChild(el);

    const setPressed = (v) => {
      touchState[def.key] = v;
      el.classList.toggle('pressed', v);
    };

    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); setPressed(true); }, {passive:false});
    el.addEventListener('touchend',   e => { e.preventDefault(); e.stopPropagation(); setPressed(false);}, {passive:false});
    el.addEventListener('touchcancel',e => { e.preventDefault(); e.stopPropagation(); setPressed(false);}, {passive:false});
  });

  touchControls.style.width  = W + 'px';
  touchControls.style.height = H + 'px';
}

// ─── Physics helpers ──────────────────────────────────────────────────────────
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }

function ballHit(ball, player, side) {
  const hw = PW/2 + 3, hh = PH/2 + 3;
  const dx = ball.x - player.x, dy = ball.y - player.y;
  if (Math.abs(dx) >= hw+BALL_R || Math.abs(dy) >= hh+BALL_R) return false;

  // Push out
  const ox = hw + BALL_R - Math.abs(dx);
  const oy = hh + BALL_R - Math.abs(dy);
  if (ox < oy) ball.x = player.x + Math.sign(dx)*(hw+BALL_R);
  else          ball.y = player.y + Math.sign(dy)*(hh+BALL_R);

  const nx = dx/(hw+BALL_R), ny = dy/(hh+BALL_R);
  const len = Math.sqrt(nx*nx+ny*ny)||1;
  const bias = side==='left' ? 1 : -1;
  ball.vx = (nx/len)*9 + bias*1.5;
  ball.vy = (ny/len)*9 - 3;

  const spd = Math.sqrt(ball.vx**2+ball.vy**2);
  if (spd > BALL_CAP) { ball.vx*=BALL_CAP/spd; ball.vy*=BALL_CAP/spd; }

  ball.inPlay = true;
  ball.touched = side;
  player.hits++;
  return true;
}

// ─── CPU AI ───────────────────────────────────────────────────────────────────
function cpuAI(rp, ball) {
  if (state.matchWinner) return;
  const pred = ball.x + ball.vx * 7;
  const diff = pred - rp.x;
  if (Math.abs(diff)>14) rp.x += Math.sign(diff)*PSPEED*0.82;
  rp.x = clamp(rp.x, NET_X+PW/2+6, BASE_W-PW/2-4);

  if ((ball.vx>0 || ball.x>NET_X+80) && rp.onGround && ball.vy>-4) {
    const dist = Math.abs(ball.y - (rp.y - PH/2));
    if (dist < 170) { rp.vy = JUMP_F; rp.onGround = false; }
  }
  if (!ball.inPlay && state.serving==='right' && state.countdown<=0) {
    ball.vx = -(3+Math.random()*2);
    ball.vy = -(8+Math.random()*4);
    ball.inPlay = true;
  }
}

// ─── Score logic ─────────────────────────────────────────────────────────────
function awardPoint(winner) {
  const loser = winner==='left'?'right':'left';
  state[winner].score++;
  const ws = state[winner].score, ls = state[loser].score;
  let flashMsg = '+1';
  let isSetWin = false;

  if (ws>=25 && ws-ls>=2) {
    state[winner].sets++;
    flashMsg = 'Set! 🏆';
    isSetWin = true;
    if (state[winner].sets>=2) {
      state.matchWinner = winner;
      gameRunning = false;
      setTimeout(showWinner, 900);
      updateUI();
      return;
    }
    state.left.score = 0;
    state.right.score = 0;
    state.set = (state.set||1)+1;
  }

  const ls2 = { score:state.left.score, sets:state.left.sets };
  const rs2 = { score:state.right.score, sets:state.right.sets };
  const setN = state.set;
  const matchW = state.matchWinner;

  const lOld = { ...state.left };
  const rOld = { ...state.right };
  state = initRound(winner, lOld, rOld);
  state.left.score  = ls2.score; state.left.sets  = ls2.sets;
  state.right.score = rs2.score; state.right.sets = rs2.sets;
  state.set = setN; state.matchWinner = matchW;
  state.flash = winner; state.flashT = 90;
  state.flashMsg = flashMsg;

  updateUI();
}

function updateUI() {
  if (!state) return;
  document.getElementById('pts-left').textContent  = state.left.score;
  document.getElementById('pts-right').textContent = state.right.score;
  document.getElementById('sets-left').textContent  = 'Sets: '+state.left.sets;
  document.getElementById('sets-right').textContent = 'Sets: '+state.right.sets;
  document.getElementById('rally-info').textContent = 'Set '+(state.set||1);
  const who = state.serving==='left'
    ? (gameMode==='1p'?'Você':'J1')
    : (gameMode==='1p'?'CPU' :'J2');
  document.getElementById('serving-info').textContent = '🏐 Saque: '+who;
}

function showWinner() {
  const w = state.matchWinner;
  const name = gameMode==='1p'?(w==='left'?'Você venceu! 🎉':'CPU venceu!')
                              :(w==='left'?'J1 venceu! 🎉':'J2 venceu! 🎉');
  document.getElementById('overlay-subtitle').textContent = name;
  document.getElementById('overlay-desc').textContent =
    'Placar final — Sets: '+state.left.sets+' × '+state.right.sets;
  document.getElementById('btn-1p').textContent = '▶ 1 Jogador (vs CPU)';
  document.getElementById('btn-2p').textContent = '👥 2 Jogadores';
  overlay.style.display = 'flex';
}

// ─── Pause ────────────────────────────────────────────────────────────────────
function togglePause() {
  if (!gameRunning && !paused) return;
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? '▶' : '⏸';
  pauseOverlay.style.display = paused ? 'flex' : 'none';
  if (!paused) { lastTime = performance.now(); requestAnimationFrame(gameLoop); }
}

document.getElementById('pause-btn').addEventListener('click', togglePause);
document.getElementById('btn-resume').addEventListener('click', togglePause);
document.getElementById('btn-menu').addEventListener('click', () => {
  paused = false; gameRunning = false;
  pauseOverlay.style.display = 'none';
  document.getElementById('pause-btn').textContent = '⏸';
  overlay.style.display = 'flex';
  document.getElementById('overlay-subtitle').textContent = 'Escolha o modo';
  document.getElementById('overlay-desc').textContent = 'Jogue até 25 pontos (diferença de 2). Quem ganhar 2 sets vence!';
  document.getElementById('btn-1p').textContent = '▶ 1 Jogador (vs CPU)';
  document.getElementById('btn-2p').textContent = '👥 2 Jogadores (mesmo teclado)';
});

// ─── Game loop ────────────────────────────────────────────────────────────────
let lastTime = 0;

function gameLoop(ts) {
  if (!gameRunning || paused) return;
  lastTime = ts;
  update();
  drawGame();
  updateUI();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (!state || state.matchWinner) return;
  const ball = state.ball, lp = state.left, rp = state.right;

  // P1 input
  const p1L = keys['KeyA'] || touchState.p1Left;
  const p1R = keys['KeyD'] || touchState.p1Right;
  const p1J = keys['KeyW'] || keys['Space'] || touchState.p1Jump;

  if (p1L) lp.x -= PSPEED;
  if (p1R) lp.x += PSPEED;
  lp.x = clamp(lp.x, PW/2+2, NET_X-PW/2-6);
  if (p1J && lp.onGround) { lp.vy=JUMP_F; lp.onGround=false; }

  // P1 gravity
  lp.vy += GRAVITY; lp.y += lp.vy;
  if (lp.y >= FLOOR_Y-PH) { lp.y=FLOOR_Y-PH; lp.vy=0; lp.onGround=true; }

  // P2 / CPU
  if (gameMode==='2p') {
    const p2L = keys['KeyJ'] || touchState.p2Left;
    const p2R = keys['KeyL'] || touchState.p2Right;
    const p2J = keys['KeyI'] || touchState.p2Jump;
    if (p2L) rp.x -= PSPEED;
    if (p2R) rp.x += PSPEED;
    rp.x = clamp(rp.x, NET_X+PW/2+6, BASE_W-PW/2-4);
    if (p2J && rp.onGround) { rp.vy=JUMP_F; rp.onGround=false; }
  } else {
    cpuAI(rp, ball);
  }
  rp.vy += GRAVITY; rp.y += rp.vy;
  if (rp.y >= FLOOR_Y-PH) { rp.y=FLOOR_Y-PH; rp.vy=0; rp.onGround=true; }

  // Serve
  if (!ball.inPlay) {
    if (state.serving==='left') {
      ball.x=lp.x; ball.y=lp.y-BALL_R-2;
      if (p1J) { ball.vx=3.5+Math.random()*2; ball.vy=-(9+Math.random()*3); ball.inPlay=true; lp.vy=JUMP_F*0.7; }
    } else {
      ball.x=rp.x; ball.y=rp.y-BALL_R-2;
      if (gameMode==='2p') {
        const p2J = keys['KeyI'] || touchState.p2Jump;
        if (p2J) { ball.vx=-(3.5+Math.random()*2); ball.vy=-(9+Math.random()*3); ball.inPlay=true; rp.vy=JUMP_F*0.7; }
      }
    }
    state.countdown--;
    return;
  }

  // Ball physics
  ball.vy += GRAVITY*0.62;
  ball.x  += ball.vx;
  ball.y  += ball.vy;

  if (ball.x < BALL_R)         { ball.x=BALL_R;        ball.vx=Math.abs(ball.vx)*0.8; }
  if (ball.x > BASE_W-BALL_R)  { ball.x=BASE_W-BALL_R; ball.vx=-Math.abs(ball.vx)*0.8; }
  if (ball.y < BALL_R)         { ball.y=BALL_R;         ball.vy=Math.abs(ball.vy)*0.8; }

  // Net
  if (ball.x>NET_X-8 && ball.x<NET_X+8 && ball.y>FLOOR_Y-NET_H) {
    ball.vx=-ball.vx*0.65; ball.x+=ball.vx>0?9:-9;
  }

  // Floor → point
  if (ball.y+BALL_R >= FLOOR_Y) {
    awardPoint(ball.x < NET_X ? 'right' : 'left');
    return;
  }

  ballHit(ball, lp, 'left');
  ballHit(ball, rp, 'right');

  if (state.flashT > 0) state.flashT--;
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
const s = v => v * SCALE;

function drawGame() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0f3460'); bg.addColorStop(1,'#16213e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  drawCrowd();

  // Floor
  ctx.fillStyle='#c8a96e'; ctx.fillRect(0,s(FLOOR_Y),W,H-s(FLOOR_Y));
  ctx.fillStyle='#e0c080'; ctx.fillRect(0,s(FLOOR_Y),W,s(3));

  // Net posts
  ctx.fillStyle='#999';
  ctx.fillRect(s(NET_X-6),s(FLOOR_Y-NET_H-14),s(4),s(NET_H+14));
  ctx.fillRect(s(NET_X+2),s(FLOOR_Y-NET_H-14),s(4),s(NET_H+14));

  // Net top cable
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=s(2.5);
  ctx.beginPath(); ctx.moveTo(s(NET_X-4),s(FLOOR_Y-NET_H)); ctx.lineTo(s(NET_X+4),s(FLOOR_Y-NET_H)); ctx.stroke();

  // Net mesh
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=s(0.8);
  for (let y=0; y<=NET_H; y+=16) {
    ctx.beginPath(); ctx.moveTo(s(NET_X-4),s(FLOOR_Y-NET_H+y)); ctx.lineTo(s(NET_X+4),s(FLOOR_Y-NET_H+y)); ctx.stroke();
  }

  // Net antennas
  [[NET_X-5,'#f00','#fff'],[NET_X+3,'#f00','#fff']].forEach(([ax,c1,c2])=>{
    ctx.fillStyle=c1; ctx.fillRect(s(ax),s(FLOOR_Y-NET_H-20),s(2),s(20));
    ctx.fillStyle=c2; ctx.fillRect(s(ax),s(FLOOR_Y-NET_H-30),s(2),s(10));
  });

  // Players & ball
  drawPlayer(state.left,  C_LEFT,  gameMode==='1p'?'J1':'J1');
  drawPlayer(state.right, C_RIGHT, gameMode==='1p'?'CPU':'J2');
  drawBall(state.ball);

  // Ball ground shadow
  const sh = Math.max(0, 1-(FLOOR_Y-state.ball.y-BALL_R)/300)*0.35;
  ctx.beginPath(); ctx.ellipse(s(state.ball.x),s(FLOOR_Y+2),s(BALL_R*0.8),s(3),0,0,Math.PI*2);
  ctx.fillStyle=`rgba(0,0,0,${sh})`; ctx.fill();

  // Score flash
  if (state.flash && state.flashT>0) {
    const a = Math.min(1, state.flashT/25);
    const tx = state.flash==='left' ? s(NET_X/2) : s(NET_X+NET_X/2);
    ctx.font=`bold ${s(24)}px 'Segoe UI',sans-serif`;
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(255,215,0,${a})`;
    ctx.fillText(state.flashMsg||'+1', tx, s(FLOOR_Y-210));
  }
}

function drawCrowd() {
  for (let i=0;i<55;i++) {
    const x=i/55*BASE_W, h=18+Math.sin(i*2.3)*7+Math.cos(i*1.1)*4;
    ctx.fillStyle=`hsl(${205+(i%5)*12},28%,${14+(i%3)*5}%)`;
    ctx.beginPath(); ctx.arc(s(x+7),s(55-h+5),s(7),0,Math.PI*2); ctx.fill();
    ctx.fillRect(s(x+2),s(55-h+5),s(10),s(18));
  }
}

function drawPlayer(p, color, label) {
  const x=s(p.x), y=s(p.y), pw=s(PW), ph=s(PH);
  // Shadow
  ctx.beginPath(); ctx.ellipse(x,s(FLOOR_Y+2),pw*.45,s(4),0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fill();
  // Jersey
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(x-pw*.38,y+ph*.28,pw*.76,ph*.5,s(4)); ctx.fill();
  // Shorts
  ctx.fillStyle=darken(color,40);
  ctx.fillRect(x-pw*.33,y+ph*.72,pw*.66,ph*.17);
  // Legs
  ctx.fillStyle='#f5cba7';
  ctx.fillRect(x-pw*.28,y+ph*.86,pw*.22,ph*.13);
  ctx.fillRect(x+pw*.06,y+ph*.86,pw*.22,ph*.13);
  // Shoes
  ctx.fillStyle='#333';
  ctx.fillRect(x-pw*.31,y+ph*.93,pw*.28,s(5));
  ctx.fillRect(x+pw*.03,y+ph*.93,pw*.28,s(5));
  // Head
  ctx.fillStyle='#f5cba7';
  ctx.beginPath(); ctx.arc(x,y+ph*.18,pw*.26,0,Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle=color==='#4cc9f0'?'#3a2918':'#111';
  ctx.beginPath(); ctx.arc(x,y+ph*.12,pw*.24,Math.PI,0); ctx.fill();
  // Arms
  const armUp = state.ball && Math.abs(state.ball.x-p.x)<90 && state.ball.y<p.y;
  ctx.strokeStyle='#f5cba7'; ctx.lineWidth=s(5); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-pw*.3, y+ph*.42);
  ctx.lineTo(x-pw*(armUp?.55:.44), armUp?y+ph*.22:y+ph*.6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+pw*.3, y+ph*.42);
  ctx.lineTo(x+pw*(armUp?.55:.44), armUp?y+ph*.22:y+ph*.6);
  ctx.stroke();
  // Label
  ctx.font=`bold ${s(10)}px 'Segoe UI',sans-serif`;
  ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.fillText(label, x, y-s(5));
}

function darken(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;
}

function drawBall(ball) {
  const x=s(ball.x), y=s(ball.y), r=s(BALL_R);
  if (ball.inPlay) {
    for (let i=1;i<=4;i++) {
      ctx.beginPath();
      ctx.arc(x-ball.vx*SCALE*i*.4, y-ball.vy*SCALE*i*.4, r*(1-i*.18), 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,215,0,${0.13-i*.025})`; ctx.fill();
    }
  }
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle='#fff8dc'; ctx.fill();
  ctx.strokeStyle='#d4b030'; ctx.lineWidth=s(1.5);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=s(1);
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*.65,0,Math.PI*2); ctx.stroke();
}

// ─── Start ────────────────────────────────────────────────────────────────────
function startGame(mode) {
  gameMode = mode;
  paused = false;
  document.getElementById('pause-btn').textContent = '⏸';
  overlay.style.display = 'none';
  pauseOverlay.style.display = 'none';

  document.getElementById('name-left').textContent  = mode==='1p'?'Você':'Jogador 1';
  document.getElementById('name-right').textContent = mode==='1p'?'CPU' :'Jogador 2';

  if (mode==='1p') {
    hint.innerHTML='<span class="key">A</span><span class="key">D</span> mover &nbsp; <span class="key">W</span> pular/sacar &nbsp; <span class="key">P</span> pausar';
  } else {
    hint.innerHTML='J1: <span class="key">A</span><span class="key">D</span><span class="key">W</span> &nbsp;|&nbsp; J2: <span class="key">J</span><span class="key">L</span><span class="key">I</span> &nbsp;|&nbsp; <span class="key">P</span> pausar';
  }

  newMatch();
  resize();
  buildTouchControls();
  updateUI();
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

document.getElementById('btn-1p').addEventListener('click', () => startGame('1p'));
document.getElementById('btn-2p').addEventListener('click', () => startGame('2p'));

resize();
</script>
